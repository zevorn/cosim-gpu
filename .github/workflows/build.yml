# SPDX-License-Identifier: Apache-2.0
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gem5:
    name: Build gem5 (VEGA_X86)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COSIM_ENV: container
      COSIM_DEV_IMAGE: cosim-dev:ci
      COSIM_GEM5_CACHE_EPOCH: ${{ vars.COSIM_GEM5_CACHE_EPOCH || '1' }}
    outputs:
      runtime-artifact: ${{ steps.runtime.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init gem5 submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 third_party/gem5

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Install the workflow parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Identify the complete gem5 build inputs
        id: build-key
        run: echo "key=$(just ci-gem5-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: gem5-cache
        with:
          path: build/cache/gem5-runtime/
          key: gem5-runtime-v2-${{ steps.build-key.outputs.key }}

      - name: Build the development image
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just dev-image

      - name: Build gem5
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just build-gem5 "$(nproc)" GOLD_LINKER=True --linker=gold

      - name: Verify binary
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: test -f "$(just --evaluate gem5_build_dir)/gem5.opt"

      - name: Package gem5 and its runtime environment
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just ci-package-gem5 build/cache/gem5-runtime

      - uses: actions/cache/save@v4
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        with:
          path: build/cache/gem5-runtime/
          key: gem5-runtime-v2-${{ steps.build-key.outputs.key }}

      - name: Publish a verified build for this workflow run
        run: just ci-reuse-gem5 build/cache/gem5-runtime build/ci-build

      - name: Verify runtime cache integrity and provenance
        run: just test-ci-artifact build/cache/gem5-runtime build/ci-build

      - uses: actions/upload-artifact@v4
        id: runtime
        with:
          name: gem5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-rocm:
    name: Build ROCm guest image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      COSIM_ENV: host
      COSIM_ROCM_IMAGE_EPOCH: ${{ vars.COSIM_ROCM_IMAGE_EPOCH || '1' }}
      COSIM_ARTIFACT_HEAD_REPO: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
      COSIM_ARTIFACT_BRANCH: ${{ github.head_ref || github.ref_name }}
    outputs:
      guest-artifact: ${{ steps.guest.outputs.artifact-id }}
      image-key: ${{ steps.image-key.outputs.key }}
      image-epoch: ${{ steps.image-key.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0
      - name: Prepare dedicated image-build host
        run: just ci-prepare-image-host
      - name: Initialize image and m5 sources
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/gem5 third_party/gem5-resources
      - name: Build the guest m5 utility
        run: just build-m5
      - name: Validate the real Packer builder and provisioners
        run: just check-rocm-image
      - name: Identify exact image inputs
        id: image-key
        run: |
          echo "key=$(just ci-rocm-assets key guest/ubuntu/24.04/x86_64/rocm7_0)" >> "$GITHUB_OUTPUT"
          echo "epoch=$COSIM_ROCM_IMAGE_EPOCH" >> "$GITHUB_OUTPUT"
      - name: Find a verified image from the same source branch
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
        run: just ci-find-rocm-artifact "$IMAGE_KEY" artifacts/rocm-selection.json >> "$GITHUB_OUTPUT"
      - name: Download the retained image
        if: steps.retained.outputs.artifact-id != ''
        id: download-image
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.retained.outputs.artifact-id }}
          run-id: ${{ steps.retained.outputs.run-id }}
          path: ${{ steps.retained.outputs.download-dir }}
          merge-multiple: true
      - name: Remove the incomplete retained download
        if: steps.download-image.outcome == 'failure'
        run: just ci-discard-rocm-download artifacts/rocm-selection.json
      - name: Verify and adopt the downloaded image
        if: steps.download-image.outcome == 'success'
        env:
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
          DOWNLOAD_DIR: ${{ steps.retained.outputs.download-dir }}
        run: just ci-adopt-rocm-artifact "$DOWNLOAD_DIR" build/images/guest/ubuntu/24.04/x86_64/rocm7_0 "$IMAGE_KEY"
      - name: Build or verify the paired ROCm disk and kernel
        run: just build-rocm-assets
      - name: Verify reuse and corruption rejection with the built image
        run: just test-rocm-assets
      - uses: actions/upload-artifact@v4
        id: guest
        with:
          name: rocm-guest-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/images/guest/ubuntu/24.04/x86_64/rocm7_0/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Preserve image build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-image-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rocm-selection.json
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/build-rocm7_0-*/logs/*.log
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/*.log
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/manifest.json
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/image-packages.tsv
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/kernel-release
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/python-packages.json
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/amdgpu-module.txt
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/hipcc-version.txt
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/os-release
          if-no-files-found: warn
          retention-days: 14
      - name: Verify published image selection and source isolation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
        run: just test-rocm-artifact "$IMAGE_KEY" artifacts/rocm-artifact-check
      - name: Preserve image selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-artifact-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rocm-artifact-check/
          if-no-files-found: warn
          retention-days: 14

  rocm:
    name: ROCm regression
    needs: [build-gem5, build-rocm]
    uses: ./.github/workflows/integration.yml
    with:
      runtime-artifact: ${{ needs.build-gem5.outputs.runtime-artifact }}
      guest-artifact: ${{ needs.build-rocm.outputs.guest-artifact }}
      image-key: ${{ needs.build-rocm.outputs.image-key }}
      image-epoch: ${{ needs.build-rocm.outputs.image-epoch }}

  regression:
    name: ROCm regression gate
    if: always()
    needs: [build-gem5, build-rocm, rocm]
    runs-on: ubuntu-24.04
    steps:
      - name: Require build and guest execution
        env:
          BUILD_RESULT: ${{ needs.build-gem5.result }}
          IMAGE_RESULT: ${{ needs.build-rocm.result }}
          ROCM_RESULT: ${{ needs.rocm.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$IMAGE_RESULT" = success
          test "$ROCM_RESULT" = success
