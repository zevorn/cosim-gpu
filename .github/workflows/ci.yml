# Fast checks on every push/PR (< 5 min, no submodules needed)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: 1.51.0

jobs:
  rust:
    name: Rust Topology and Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Install QEMU for session tests
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils python3-pexpect python3-yaml
      - name: Check Rust source and topology behavior
        run: just check-cosim
      - name: Run sessions with QEMU processes, disks and signals
        run: just test-cosim-integration
      - name: Verify CI cancellation and log retention
        run: just test-ci-integration

  regression-runner:
    name: ROCm regression runner tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Install console and YAML libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pexpect python3-yaml qemu-system-x86 qemu-utils
      - name: Check command completion and failure handling
        run: just test-ci
      - name: Verify legacy build image selection
        run: just test-legacy-build-image

  checkpatch:
    name: Checkpatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Run checkpatch on new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          just check-patch "$base"

  maintainers:
    name: Maintainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r scripts/ci/requirements.txt
      - name: Validate MAINTAINERS.yml and file coverage
        run: just check-maintainers

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Run ShellCheck
        run: just check-shell

  modprobe-params:
    name: Modprobe Params (Regression #9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Verify cosim modprobe parameters
        run: just check-modprobe-params

  kernel-compile:
    name: GPU Kernel Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Compile GPU kernels
        run: just build-gpu-tests
