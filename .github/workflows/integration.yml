# SPDX-License-Identifier: Apache-2.0
name: Integration

on:
  workflow_call:
    inputs:
      runtime-artifact:
        description: Immutable artifact ID produced by the build job
        required: true
        type: string
      guest-artifact:
        description: Immutable paired kernel/disk artifact ID
        required: true
        type: string
      image-key:
        description: Exact image inputs requested by the current producer
        required: true
        type: string
      image-epoch:
        description: Image build epoch used by the current producer
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cosim-full-test:
    name: Full ROCm guest regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COSIM_ENV: container
      COSIM_DEV_IMAGE: cosim-dev:ci
      COSIM_ROCM_IMAGE_EPOCH: ${{ inputs.image-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Check KVM
        run: |
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Initialize simulator sources
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/gem5 third_party/qemu third_party/gem5-resources
          git -C third_party/gem5 submodule update --init --recursive --depth 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.runtime-artifact }}
          path: build/ci-build
          merge-multiple: true

      - name: Restore verified gem5 and development image
        run: just ci-restore-gem5 build/ci-build

      - name: Verify competing session memory reservations
        run: just test-cosim-memory

      - name: Test the restored MI300X model
        run: just test-gem5-mi300x artifacts/rocm-regression/model

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.guest-artifact }}
          path: build/rocm-artifact-download
          merge-multiple: true

      - name: Install QEMU image tools for artifact validation
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils qemu-utils
          qemu-img --version

      - name: Verify and adopt the paired disk, kernel and package manifest
        env:
          IMAGE_KEY: ${{ inputs.image-key }}
        run: just ci-adopt-rocm-artifact build/rocm-artifact-download build/images/guest/ubuntu/24.04/x86_64/rocm7_0 "$IMAGE_KEY"

      - name: Build QEMU and Rust launcher
        run: |
          just build-qemu
          just build-cosim

      - name: Verify vfio-user option ROM exposure
        run: just test-cosim-vfio-user

      - name: Run ROCm workloads through the Rust launcher
        run: just test-rocm-regression artifacts/rocm-regression/guest build/images/guest/ubuntu/24.04/x86_64/rocm7_0

      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rocm-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rocm-regression/
            build/images/guest/ubuntu/24.04/x86_64/rocm7_0/manifest.json
            build/ci-build/manifest.json
            !artifacts/rocm-regression/**/*.sock
          if-no-files-found: warn
          retention-days: 14
