    Guest operating system image profiles built with Packer and Ansible,
    along with the kernel and driver setup used by cosim.

Guest Tests:
  status: maintained
  maintainers:
    - zevorn
  files:
    - scripts/run_cosim_tests.sh
    - scripts/ci/guest_console.py
    - scripts/ci/ci_lifecycle.py
    - scripts/ci/rocm_guest.sh
    - scripts/ci/run_rocm.py
    - scripts/ci/test_guest_console.py
