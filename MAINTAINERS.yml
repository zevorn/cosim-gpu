Patch Checking and Maintainers:
  status: maintained
  maintainers:
    - zevorn
  files:
    - MAINTAINERS.yml
    - scripts/check_patch.sh
    - scripts/checkpatch.pl
    - scripts/ci/
    - scripts/get_maintainer.py
  labels:
    - "area: process"
