- name: Provision the selected guest image profile
  hosts: default
  become: true
  gather_facts: true
  tasks:
    - name: Apply profile-specific operating system tasks
      ansible.builtin.include_tasks: "{{ cosim_profile_tasks }}"

    - name: Fetch declared build artifacts from the guest
      ansible.builtin.fetch:
        src: "{{ item.guest_path }}"
        dest: "{{ cosim_output_directory }}/{{ item.name }}"
        flat: true
      loop: "{{ cosim_outputs }}"
