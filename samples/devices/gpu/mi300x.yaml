version: 1
templates:
  mi300x:
    kind: gem5-mi300x
    config: third_party/gem5/configs/example/gpufs/mi300_cosim.py
    runtime:
      binary: build/gem5/x86_64/VEGA_X86/gem5.opt
    memory_regions:
      - {name: vram, size: 16G, align: 2M}
    pci:
      vendor_id: 0x1002
      device_id: 0x74a0
      msix_vectors: 256
      rom: third_party/gem5-resources/src/x86-ubuntu-gpu-ml/files/mi300.rom
    args:
      num_compute_units: 40
      gem5_debug_flags: []
    guest_hints:
      modprobe: >-
        amdgpu ip_block_mask=0x67 ppfeaturemask=0 dpm=0 audio=0 ras_enable=0 discovery=2
  mi300x-aarch64:
    use: mi300x
    runtime:
      binary: build/gem5/aarch64/VEGA_X86/gem5.opt
